<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Repair Tool</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap');

  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #252320;
    --border: #333129;
    --text: #e8e4d9;
    --muted: #7a7568;
    --accent: #e05c5c;
    --accent2: #c8a96e;
    --fixed: #4caf82;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--muted); font-weight: 300; font-style: italic; font-size: 16px; }

  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .progress-info { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.6; }
  .progress-bar-wrap { width: 140px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .progress-bar-fill { height: 100%; background: var(--fixed); border-radius: 2px; transition: width 0.4s ease; }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .btn-primary { background: var(--accent2); color: #0f0e0c; border-color: var(--accent2); font-weight: 500; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  /* Drop zone */
  .drop-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 32px;
  }

  .drop-box {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 60px 80px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .drop-box:hover, .drop-box.drag-over { border-color: var(--accent); background: rgba(224,92,92,0.04); }
  .drop-icon { font-size: 40px; margin-bottom: 12px; display: block; }
  .drop-box h2 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; color: var(--text); margin-bottom: 6px; }
  .drop-box p { font-size: 11px; color: var(--muted); line-height: 1.7; }
  #file-input { display: none; }

  /* Review layout */
  .review-layout { display: none; flex-direction: column; flex: 1; }
  .review-layout.active { display: flex; }

  .cards-area {
    flex: 1;
    padding: 20px 20px 10px;
    display: flex;
    gap: 14px;
  }

  /* Card */
  .card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
    transition: border-color 0.2s;
  }

  .card.is-fixed { border-color: var(--fixed); box-shadow: 0 0 0 1px var(--fixed), inset 0 0 30px rgba(76,175,130,0.04); }
  .card.is-skipped { border-color: var(--muted); opacity: 0.5; }

  .card-img-wrap {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .img-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px; color: var(--muted); font-size: 10px;
  }
  .img-placeholder span:first-child { font-size: 28px; }

  /* Rejected badge */
  .badge {
    position: absolute;
    top: 8px; left: 8px;
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    padding: 3px 7px;
    border-radius: 4px;
    font-weight: 500;
  }
  .badge-rejected { background: rgba(224,92,92,0.85); color: #fff; }
  .badge-fixed { background: rgba(76,175,130,0.85); color: #fff; }
  .badge-skipped { background: rgba(122,117,104,0.85); color: #fff; }

  .card-body {
    padding: 10px 12px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .card-index { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  a.card-title { text-decoration: none; }
  a.card-title:hover { color: var(--accent2); text-decoration: underline; text-underline-offset: 3px; }

  .card-country { font-size: 9px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }

  /* URL input area */
  .card-input-area {
    padding: 8px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .input-label { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; }

  .url-row { display: flex; gap: 6px; }

  .url-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
  }
  .url-input:focus { border-color: var(--accent2); }
  .url-input.has-value { border-color: rgba(76,175,130,0.5); }
  .url-input::placeholder { color: var(--muted); }

  .preview-btn {
    flex-shrink: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 14px;
    padding: 0 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preview-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .card-actions { display: flex; gap: 6px; padding: 0 12px 12px; }

  .action-btn {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    background: transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .btn-apply { color: var(--fixed); border-color: rgba(76,175,130,0.3); }
  .btn-apply:hover { background: rgba(76,175,130,0.1); border-color: var(--fixed); }
  .btn-skip { color: var(--muted); border-color: var(--border); }
  .btn-skip:hover { background: var(--surface2); color: var(--text); }

  /* Nav */
  .nav-bar {
    padding: 10px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    gap: 12px;
  }

  .nav-stats { display: flex; gap: 18px; font-size: 11px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .stat-dot.fixed { background: var(--fixed); }
  .stat-dot.skipped { background: var(--muted); }
  .stat-dot.pending { background: var(--accent); }
  .stat-label { color: var(--muted); }
  .stat-value { color: var(--text); }

  .nav-btns { display: flex; gap: 8px; align-items: center; }
  .page-info { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .kbd-hint { font-size: 10px; color: var(--muted); text-align: center; padding-bottom: 4px; }
  kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-family: inherit; font-size: 9px; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--muted); text-align: center;
    padding: 40px;
  }
  .empty-state span:first-child { font-size: 48px; }
  .empty-state h3 { font-family: 'Fraunces', serif; font-weight: 300; color: var(--text); font-size: 18px; }
  .empty-state p { font-size: 11px; line-height: 1.7; max-width: 300px; }
</style>
</head>
<body>

<header>
  <div class="logo">Repair <span>/ image fix</span></div>
  <div class="header-right">
    <div class="progress-info" id="progress-info" style="display:none">
      <div id="progress-text">0 / 0 fixed</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <button class="btn btn-primary" id="export-btn" style="display:none" onclick="exportJSON()">Export JSON</button>
    <button class="btn btn-ghost" id="load-new-btn" style="display:none" onclick="resetAll()">Load new file</button>
  </div>
</header>

<div class="drop-zone" id="drop-zone">
  <div class="drop-box" id="drop-box">
    <span class="drop-icon">🔧</span>
    <h2>Drop your reviewed JSON</h2>
    <p>Load a JSON file with <em>image_review: false</em> entries.<br>Only rejected images will be shown for repair.</p>
  </div>
  <input type="file" id="file-input" accept=".json">
</div>

<div class="review-layout" id="review-layout">
  <div class="cards-area" id="cards-area"></div>
  <div class="kbd-hint"><kbd>Enter</kbd> apply URL · <kbd>S</kbd> skip · <kbd>←</kbd><kbd>→</kbd> navigate</div>
  <div class="nav-bar">
    <div class="nav-stats">
      <div class="stat"><div class="stat-dot fixed"></div><span class="stat-label">Fixed:</span><span class="stat-value" id="count-fixed">0</span></div>
      <div class="stat"><div class="stat-dot skipped"></div><span class="stat-label">Skipped:</span><span class="stat-value" id="count-skipped">0</span></div>
      <div class="stat"><div class="stat-dot pending"></div><span class="stat-label">Pending:</span><span class="stat-value" id="count-pending">0</span></div>
    </div>
    <div class="nav-btns">
      <button class="btn btn-ghost" id="prev-btn" onclick="navigate(-1)">← Prev</button>
      <span class="page-info" id="page-info">Page 1</span>
      <button class="btn btn-ghost" id="next-btn" onclick="navigate(1)">Next →</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 5;
let allRows = [];       // full original dataset
let rejectedRows = [];  // only the false ones, with pointer back to allRows index
let repairs = {};       // rejectedIdx -> { url, status: 'fixed'|'skipped' }
let currentPage = 0;

// ---------- File loading ----------
const dropBox = document.getElementById('drop-box');
const fileInput = document.getElementById('file-input');

dropBox.addEventListener('click', () => fileInput.click());
dropBox.addEventListener('dragover', e => { e.preventDefault(); dropBox.classList.add('drag-over'); });
dropBox.addEventListener('dragleave', () => dropBox.classList.remove('drag-over'));
dropBox.addEventListener('drop', e => {
  e.preventDefault(); dropBox.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try { data = JSON.parse(e.target.result); } catch(err) { alert('Could not parse JSON: ' + err.message); return; }
    if (!Array.isArray(data)) { alert('JSON must be an array of objects.'); return; }
    allRows = data;
    // Extract only rejected rows, keeping their original index
    rejectedRows = allRows
      .map((r, i) => ({ ...r, _origIdx: i }))
      .filter(r => r.image_review === false);
    repairs = {};
    currentPage = 0;

    if (rejectedRows.length === 0) {
      alert('No rejected images found (image_review: false). Nothing to repair!');
      return;
    }

    showReview();
  };
  reader.readAsText(file);
}

function showReview() {
  document.getElementById('drop-zone').style.display = 'none';
  const layout = document.getElementById('review-layout');
  layout.classList.add('active');
  document.getElementById('progress-info').style.display = 'block';
  document.getElementById('export-btn').style.display = 'inline-block';
  document.getElementById('load-new-btn').style.display = 'inline-block';
  renderPage();
}

function resetAll() {
  allRows = []; rejectedRows = []; repairs = {}; currentPage = 0;
  document.getElementById('drop-zone').style.display = '';
  document.getElementById('review-layout').classList.remove('active');
  document.getElementById('progress-info').style.display = 'none';
  document.getElementById('export-btn').style.display = 'none';
  document.getElementById('load-new-btn').style.display = 'none';
  fileInput.value = '';
}

// ---------- Image resolution (same as review tool) ----------
const _wikiCache = {};
const _unescoCache = {};
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://proxy.cors.sh/${u}`,
];

async function fetchWithFallback(url) {
  for (const makeProxy of PROXIES) {
    const proxyUrl = makeProxy(url);
    try {
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(6000) });
      if (res.ok) return proxyUrl;
    } catch(e) {}
  }
  return url;
}

async function resolveImageUrl(url) {
  if (!url) return '';
  if (/whc\.unesco\.org/i.test(url)) {
    if (_unescoCache[url]) return _unescoCache[url];
    const resolved = await fetchWithFallback(url);
    _unescoCache[url] = resolved;
    return resolved;
  }
  const wikiMatch = url.match(/Special:FilePath\/([^?&#]+)/i) || url.match(/Special%3AFilePath%2F([^?&#]+)/i);
  if (wikiMatch) {
    const filename = decodeURIComponent(wikiMatch[1]);
    if (_wikiCache[filename]) return _wikiCache[filename];
    try {
      const api = `https://commons.wikimedia.org/w/api.php?action=query&titles=File:${encodeURIComponent(filename)}&prop=imageinfo&iiprop=url&format=json&origin=*`;
      const resp = await fetch(api);
      const data = await resp.json();
      const pages = data.query.pages;
      const page = pages[Object.keys(pages)[0]];
      const direct = page?.imageinfo?.[0]?.url;
      if (direct) { _wikiCache[filename] = direct; return direct; }
    } catch(e) {}
    return 'https://corsproxy.io/?' + encodeURIComponent(url);
  }
  return url;
}

// ---------- Rendering ----------
function renderPage() {
  const area = document.getElementById('cards-area');
  area.innerHTML = '';

  const start = currentPage * PAGE_SIZE;
  const pageRows = rejectedRows.slice(start, start + PAGE_SIZE);

  pageRows.forEach((row, i) => {
    const rIdx = start + i; // index into rejectedRows
    const rep = repairs[rIdx];
    const status = rep?.status;

    const card = document.createElement('div');
    card.className = 'card' + (status === 'fixed' ? ' is-fixed' : status === 'skipped' ? ' is-skipped' : '');
    card.dataset.ridx = rIdx;

    // Image wrap
    const imgWrap = document.createElement('div');
    imgWrap.className = 'card-img-wrap';

    const badge = document.createElement('div');
    badge.className = 'badge ' + (status === 'fixed' ? 'badge-fixed' : status === 'skipped' ? 'badge-skipped' : 'badge-rejected');
    badge.textContent = status === 'fixed' ? 'FIXED' : status === 'skipped' ? 'SKIPPED' : 'REJECTED';

    const ph = document.createElement('div');
    ph.className = 'img-placeholder';
    ph.innerHTML = '<span>🖼</span><span>Loading…</span>';

    const img = document.createElement('img');
    img.alt = '';
    img.addEventListener('load', () => { img.style.opacity = '1'; ph.style.display = 'none'; });
    img.addEventListener('error', () => { img.style.display = 'none'; ph.innerHTML = '<span>⚠️</span><span>No image</span>'; });

    imgWrap.appendChild(badge);
    imgWrap.appendChild(ph);
    imgWrap.appendChild(img);

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';
    const titleHtml = row.article_link
      ? `<a class="card-title" href="${esc(row.article_link)}" target="_blank" rel="noopener">${esc(row.title || '—')}</a>`
      : `<div class="card-title">${esc(row.title || '—')}</div>`;
    body.innerHTML = `<div class="card-index">#${row._origIdx + 1} · rejected</div>${titleHtml}<div class="card-country">${esc(row.country || '')}</div>`;

    // Input area
    const inputArea = document.createElement('div');
    inputArea.className = 'card-input-area';

    const label = document.createElement('div');
    label.className = 'input-label';
    label.textContent = 'NEW IMAGE URL';

    const urlRow = document.createElement('div');
    urlRow.className = 'url-row';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'url-input' + (rep?.url ? ' has-value' : '');
    input.placeholder = 'https://...';
    input.value = rep?.url || '';
    input.dataset.ridx = rIdx;

    input.addEventListener('input', () => {
      input.classList.toggle('has-value', input.value.trim().length > 0);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); applyUrl(rIdx, input.value.trim()); }
    });

    const previewBtn = document.createElement('button');
    previewBtn.className = 'preview-btn';
    previewBtn.title = 'Preview URL in new tab';
    previewBtn.textContent = '↗';
    previewBtn.addEventListener('click', () => {
      const url = input.value.trim();
      if (url) window.open(url, '_blank');
    });

    urlRow.appendChild(input);
    urlRow.appendChild(previewBtn);
    inputArea.appendChild(label);
    inputArea.appendChild(urlRow);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const applyBtn = document.createElement('button');
    applyBtn.className = 'action-btn btn-apply';
    applyBtn.innerHTML = '✓ Apply';
    applyBtn.addEventListener('click', () => applyUrl(rIdx, input.value.trim()));

    const skipBtn = document.createElement('button');
    skipBtn.className = 'action-btn btn-skip';
    skipBtn.innerHTML = '— Skip';
    skipBtn.addEventListener('click', () => skipCard(rIdx));

    actions.appendChild(applyBtn);
    actions.appendChild(skipBtn);

    card.appendChild(imgWrap);
    card.appendChild(body);
    card.appendChild(inputArea);
    card.appendChild(actions);
    area.appendChild(card);

    // Load current image (original or repaired url)
    const urlToShow = rep?.url || row.image_url || '';
    if (urlToShow) {
      resolveImageUrl(urlToShow).then(resolved => { img.src = resolved; });
    } else {
      ph.innerHTML = '<span>🖼</span><span>No URL</span>';
    }
  });

  updateStats();
  updateNav();
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyUrl(rIdx, url) {
  if (!url) { alert('Please enter a URL first.'); return; }
  repairs[rIdx] = { url, status: 'fixed' };
  refreshCard(rIdx);
  updateStats();
}

function skipCard(rIdx) {
  repairs[rIdx] = { url: repairs[rIdx]?.url || '', status: 'skipped' };
  refreshCard(rIdx);
  updateStats();
}

function refreshCard(rIdx) {
  const card = document.querySelector(`.card[data-ridx="${rIdx}"]`);
  if (!card) return;
  const rep = repairs[rIdx];
  const status = rep?.status;
  card.className = 'card' + (status === 'fixed' ? ' is-fixed' : status === 'skipped' ? ' is-skipped' : '');
  const badge = card.querySelector('.badge');
  if (badge) {
    badge.className = 'badge ' + (status === 'fixed' ? 'badge-fixed' : status === 'skipped' ? 'badge-skipped' : 'badge-rejected');
    badge.textContent = status === 'fixed' ? 'FIXED' : status === 'skipped' ? 'SKIPPED' : 'REJECTED';
  }
  // Update image to new URL if fixed
  if (status === 'fixed' && rep.url) {
    const img = card.querySelector('img');
    const ph = card.querySelector('.img-placeholder');
    if (img) {
      img.style.opacity = '0';
      img.style.display = '';
      if (ph) ph.style.display = '';
      resolveImageUrl(rep.url).then(resolved => { img.src = resolved; });
    }
  }
}

function updateStats() {
  const fixed = Object.values(repairs).filter(r => r.status === 'fixed').length;
  const skipped = Object.values(repairs).filter(r => r.status === 'skipped').length;
  const pending = rejectedRows.length - fixed - skipped;
  document.getElementById('count-fixed').textContent = fixed;
  document.getElementById('count-skipped').textContent = skipped;
  document.getElementById('count-pending').textContent = pending;
  const done = fixed + skipped;
  document.getElementById('progress-text').textContent = `${done} / ${rejectedRows.length} done`;
  document.getElementById('progress-fill').style.width = (rejectedRows.length ? done / rejectedRows.length * 100 : 0) + '%';
}

function updateNav() {
  const totalPages = Math.ceil(rejectedRows.length / PAGE_SIZE);
  document.getElementById('page-info').textContent = `Page ${currentPage + 1} of ${totalPages}`;
  document.getElementById('prev-btn').disabled = currentPage === 0;
  document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;
}

function navigate(dir) {
  const totalPages = Math.ceil(rejectedRows.length / PAGE_SIZE);
  const next = currentPage + dir;
  if (next < 0 || next >= totalPages) return;
  currentPage = next;
  renderPage();
}

// ---------- Export ----------
function exportJSON() {
  // Merge repairs back into allRows
  const output = allRows.map((row, i) => ({ ...row }));

  rejectedRows.forEach((row, rIdx) => {
    const rep = repairs[rIdx];
    const origIdx = row._origIdx;
    if (rep?.status === 'fixed' && rep.url) {
      output[origIdx].image_url = rep.url;
      output[origIdx].image_review = true;  // now approved
    } else if (rep?.status === 'skipped') {
      output[origIdx].image_review = true; // skipped = accepted as-is
    }
    // pending: leave image_review as false
  });

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'repaired_data.json';
  a.click();
}

// ---------- Keyboard ----------
document.addEventListener('keydown', e => {
  if (!document.getElementById('review-layout').classList.contains('active')) return;
  if (e.target.tagName === 'INPUT') return; // don't hijack typing

  if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key.toLowerCase() === 's') {
    // Skip focused card or first pending on page
    const start = currentPage * PAGE_SIZE;
    for (let i = 0; i < PAGE_SIZE; i++) {
      const rIdx = start + i;
      if (rIdx < rejectedRows.length && !repairs[rIdx]) { skipCard(rIdx); break; }
    }
  }
});
</script>
</body>
</html>
