<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Review Tool</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap');

  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #252320;
    --border: #333129;
    --text: #e8e4d9;
    --muted: #7a7568;
    --accent: #c8a96e;
    --tick: #4caf82;
    --cross: #e05c5c;
    --tick-bg: rgba(76,175,130,0.12);
    --cross-bg: rgba(224,92,92,0.12);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--muted); font-weight: 300; font-style: italic; font-size: 18px; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .progress-info {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    line-height: 1.6;
  }

  .progress-bar-wrap {
    width: 160px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .btn-primary {
    background: var(--accent);
    color: #0f0e0c;
    border-color: var(--accent);
    font-weight: 500;
  }

  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .drop-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 60px 32px;
    text-align: center;
  }

  .drop-box {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 60px 80px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    max-width: 480px;
    width: 100%;
  }

  .drop-box:hover, .drop-box.drag-over {
    border-color: var(--accent);
    background: rgba(200,169,110,0.04);
  }

  .drop-icon {
    font-size: 40px;
    margin-bottom: 12px;
    display: block;
  }

  .drop-box h2 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 6px;
  }

  .drop-box p {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  #file-input { display: none; }

  /* Main review layout */
  .review-layout { display: none; flex-direction: column; flex: 1; }
  .review-layout.active { display: flex; }

  .cards-area {
    flex: 1;
    padding: 24px 24px 12px;
    display: flex;
    gap: 16px;
    overflow: visible;
  }

  .card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    min-width: 0;
  }

  .card:hover { border-color: var(--muted); }

  .card.voted-good {
    border-color: var(--tick);
    box-shadow: 0 0 0 1px var(--tick), inset 0 0 30px rgba(76,175,130,0.05);
  }

  .card.voted-bad {
    border-color: var(--cross);
    box-shadow: 0 0 0 1px var(--cross), inset 0 0 30px rgba(224,92,92,0.05);
  }

  .card-img-wrap {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s;
  }

  .img-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--muted);
    font-size: 10px;
  }

  .img-placeholder span { font-size: 28px; }

  .card-body {
    padding: 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }

  .card-index {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .card-country {
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    padding: 10px 14px 14px;
  }

  .vote-btn {
    flex: 1;
    padding: 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 18px;
    transition: all 0.15s;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
  }

  .vote-btn .emoji { font-size: 16px; }

  .vote-tick {
    color: var(--tick);
    border-color: rgba(76,175,130,0.3);
  }

  .vote-tick:hover, .vote-tick.active {
    background: var(--tick-bg);
    border-color: var(--tick);
  }

  .vote-cross {
    color: var(--cross);
    border-color: rgba(224,92,92,0.3);
  }

  .vote-cross:hover, .vote-cross.active {
    background: var(--cross-bg);
    border-color: var(--cross);
  }

  /* Nav */
  .nav-bar {
    padding: 12px 24px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    gap: 12px;
  }

  .nav-stats {
    display: flex;
    gap: 20px;
    font-size: 11px;
  }

  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .stat-dot.tick { background: var(--tick); }
  .stat-dot.cross { background: var(--cross); }
  .stat-dot.pending { background: var(--muted); }
  .stat-label { color: var(--muted); }
  .stat-value { color: var(--text); }

  .nav-btns { display: flex; gap: 8px; align-items: center; }

  .page-info {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Keyboard hint */
  .kbd-hint {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding-bottom: 4px;
  }

  kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: inherit;
    font-size: 9px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Curator <span>/ image review</span></div>
  <div class="header-right">
    <div class="progress-info" id="progress-info" style="display:none">
      <div id="progress-text">0 / 0 reviewed</div>
      <div class="progress-bar-wrap" style="margin-top:5px">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <button class="btn btn-primary" id="export-btn" style="display:none" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-ghost" id="load-new-btn" style="display:none" onclick="resetAll()">Load new file</button>
  </div>
</header>

<!-- Drop zone -->
<div class="drop-zone" id="drop-zone">
  <div class="drop-box" id="drop-box">
    <span class="drop-icon">📂</span>
    <h2>Drop your CSV here</h2>
    <p>or click to browse<br><br>Accepts <strong>.json</strong> (array of objects) or <strong>.csv</strong> / <strong>.tsv</strong>.<br>An <em>image_review</em> column will be added for your verdicts.</p>
  </div>
  <input type="file" id="file-input" accept=".json,.csv,.tsv,.txt">
</div>

<!-- Review layout -->
<div class="review-layout" id="review-layout">
  <div class="cards-area" id="cards-area"></div>
  <div class="kbd-hint">
    Keyboard: <kbd>1</kbd>–<kbd>5</kbd> toggle tick · <kbd>Q</kbd>–<kbd>T</kbd> toggle cross · <kbd>←</kbd><kbd>→</kbd> navigate
  </div>
  <div class="nav-bar">
    <div class="nav-stats">
      <div class="stat">
        <div class="stat-dot tick"></div>
        <span class="stat-label">Good:</span>
        <span class="stat-value" id="count-tick">0</span>
      </div>
      <div class="stat">
        <div class="stat-dot cross"></div>
        <span class="stat-label">Bad:</span>
        <span class="stat-value" id="count-cross">0</span>
      </div>
      <div class="stat">
        <div class="stat-dot pending"></div>
        <span class="stat-label">Pending:</span>
        <span class="stat-value" id="count-pending">0</span>
      </div>
    </div>
    <div class="nav-btns">
      <button class="btn btn-ghost" id="prev-btn" onclick="navigate(-1)">← Prev</button>
      <span class="page-info" id="page-info">Page 1</span>
      <button class="btn btn-ghost" id="next-btn" onclick="navigate(1)">Next →</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 5;
let rows = [];
let headers = [];
let currentPage = 0;
let reviewCol = 'image_review';
let sourceFormat = 'json'; // 'json' or 'csv'


// ---------- CSV parsing ----------
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return null;
  const sep = lines[0].includes('\t') ? '\t' : ',';
  
  function parseLine(line) {
    const result = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === sep && !inQ) {
        result.push(cur); cur = '';
      } else cur += c;
    }
    result.push(cur);
    return result;
  }

  const hdr = parseLine(lines[0]).map(h => h.trim().replace(/^"|"$/g, ''));
  const data = lines.slice(1).map(line => {
    const vals = parseLine(line);
    const obj = {};
    hdr.forEach((h, i) => obj[h] = (vals[i] || '').trim().replace(/^"|"$/g, ''));
    return obj;
  });
  return { headers: hdr, data };
}

function toCSV(headers, rows) {
  function esc(v) {
    v = String(v ?? '');
    if (v.includes(',') || v.includes('"') || v.includes('\n')) {
      return '"' + v.replace(/"/g, '""') + '"';
    }
    return v;
  }
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r => lines.push(headers.map(h => esc(r[h])).join(',')));
  return lines.join('\n');
}

// ---------- File loading ----------
const dropBox = document.getElementById('drop-box');
const fileInput = document.getElementById('file-input');

dropBox.addEventListener('click', () => fileInput.click());
dropBox.addEventListener('dragover', e => { e.preventDefault(); dropBox.classList.add('drag-over'); });
dropBox.addEventListener('dragleave', () => dropBox.classList.remove('drag-over'));
dropBox.addEventListener('drop', e => {
  e.preventDefault(); dropBox.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const isJson = file.name.endsWith('.json') || text.trimStart().startsWith('[') || text.trimStart().startsWith('{');
    if (isJson) {
      loadJSON(text);
    } else {
      const parsed = parseCSV(text);
      if (!parsed) { alert('Could not parse CSV.'); return; }
      headers = parsed.headers;
      rows = parsed.data;
      if (!headers.includes(reviewCol)) headers.push(reviewCol);
      rows.forEach(r => { if (r[reviewCol] === undefined) r[reviewCol] = null; });
      sourceFormat = 'csv';
      currentPage = 0;
      showReview();
    }
  };
  reader.readAsText(file);
}

function loadJSON(text) {
  let data;
  try { data = JSON.parse(text); } catch(e) { alert('Could not parse JSON: ' + e.message); return; }
  if (!Array.isArray(data)) { alert('JSON must be an array of objects.'); return; }
  rows = data.map(r => ({ ...r, [reviewCol]: r[reviewCol] ?? null }));
  // Derive headers from all keys present
  const keySet = new Set();
  rows.forEach(r => Object.keys(r).forEach(k => keySet.add(k)));
  headers = [...keySet];
  if (!headers.includes(reviewCol)) headers.push(reviewCol);
  sourceFormat = 'json';
  currentPage = 0;
  showReview();
}

function showReview() {
  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('review-layout').classList.add('active');
  document.getElementById('progress-info').style.display = 'block';
  document.getElementById('export-btn').style.display = 'inline-block';
  document.getElementById('export-btn').textContent = sourceFormat === 'json' ? 'Export JSON' : 'Export CSV';
  document.getElementById('load-new-btn').style.display = 'inline-block';
  renderPage();
}

function resetAll() {
  rows = []; headers = []; currentPage = 0;
  document.getElementById('drop-zone').style.display = '';
  document.getElementById('review-layout').classList.remove('active');
  document.getElementById('progress-info').style.display = 'none';
  document.getElementById('export-btn').style.display = 'none';
  document.getElementById('load-new-btn').style.display = 'none';
  fileInput.value = '';
}

// ---------- Image URL resolver ----------
// commons.wikimedia.org/wiki/Special:FilePath/X is a redirect, not a direct image.
// Resolve it via the Wikimedia API to a direct upload.wikimedia.org URL.
// UNESCO blocks hotlinking — proxy those too.
const _wikiCache = {};

// Try multiple proxies in sequence for blocked URLs
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://proxy.cors.sh/${u}`,
];

async function fetchWithFallback(url) {
  for (const makeProxy of PROXIES) {
    const proxyUrl = makeProxy(url);
    try {
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(6000) });
      if (res.ok) return proxyUrl;
    } catch(e) {}
  }
  return url; // give up, return original
}

const _unescoCache = {};

async function resolveImageUrl(url) {
  if (!url) return '';

  // UNESCO: try proxies in order, cache the first that works
  if (/whc\.unesco\.org/i.test(url)) {
    if (_unescoCache[url]) return _unescoCache[url];
    const resolved = await fetchWithFallback(url);
    _unescoCache[url] = resolved;
    return resolved;
  }

  // Wikimedia Special:FilePath — resolve via API to direct upload URL
  const wikiMatch = url.match(/Special:FilePath\/([^?&#]+)/i)
    || url.match(/Special%3AFilePath%2F([^?&#]+)/i);
  if (wikiMatch) {
    const filename = decodeURIComponent(wikiMatch[1]);
    if (_wikiCache[filename]) return _wikiCache[filename];
    // Try Commons API first (CORS-enabled with origin=*)
    try {
      const api = `https://commons.wikimedia.org/w/api.php?action=query&titles=File:${encodeURIComponent(filename)}&prop=imageinfo&iiprop=url&format=json&origin=*`;
      const resp = await fetch(api);
      const data = await resp.json();
      const pages = data.query.pages;
      const page = pages[Object.keys(pages)[0]];
      const direct = page?.imageinfo?.[0]?.url;
      if (direct) { _wikiCache[filename] = direct; return direct; }
    } catch(e) {}
    // Last resort: corsproxy
    return 'https://corsproxy.io/?' + encodeURIComponent(url);
  }

  return url;
}

// ---------- Rendering ----------
function renderPage() {
  const area = document.getElementById('cards-area');
  area.innerHTML = '';

  const start = currentPage * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);

  pageRows.forEach((row, i) => {
    const idx = start + i;
    const voted = row[reviewCol];
    const card = document.createElement('div');
    card.className = 'card' + (voted === true ? ' voted-good' : voted === false ? ' voted-bad' : '');
    card.dataset.idx = idx;

    // Build card DOM properly so event listeners work after async src assignment
    const imgWrap = document.createElement('div');
    imgWrap.className = 'card-img-wrap';

    const ph = document.createElement('div');
    ph.className = 'img-placeholder';
    ph.innerHTML = '<span>🖼</span><span>Loading…</span>';

    const img = document.createElement('img');
    img.alt = '';
    img.style.opacity = '0';
    img.addEventListener('load', () => {
      img.style.opacity = '1';
      ph.style.display = 'none';
    });
    img.addEventListener('error', () => {
      img.style.display = 'none';
      ph.innerHTML = '<span>⚠️</span><span>No image</span>';
    });

    imgWrap.appendChild(ph);
    imgWrap.appendChild(img);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `
      <div class="card-index">#${idx + 1}</div>
      <div class="card-title">${esc(row.title || '—')}</div>
      <div class="card-country">${esc(row.country || '')}</div>`;

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const tickBtn = document.createElement('button');
    tickBtn.className = 'vote-btn vote-tick' + (voted === true ? ' active' : '');
    tickBtn.innerHTML = '<span class="emoji">✓</span> Good';
    tickBtn.addEventListener('click', () => vote(idx, true));

    const crossBtn = document.createElement('button');
    crossBtn.className = 'vote-btn vote-cross' + (voted === false ? ' active' : '');
    crossBtn.innerHTML = '<span class="emoji">✗</span> Bad';
    crossBtn.addEventListener('click', () => vote(idx, false));

    actions.appendChild(tickBtn);
    actions.appendChild(crossBtn);

    card.appendChild(imgWrap);
    card.appendChild(body);
    card.appendChild(actions);
    area.appendChild(card);

    // Resolve URL async, then assign — listeners already attached so they'll fire
    const rawUrl = row.image_url || '';
    if (rawUrl) {
      resolveImageUrl(rawUrl).then(resolved => { img.src = resolved; });
    } else {
      ph.innerHTML = '<span>🖼</span><span>No URL</span>';
    }
  });

  updateStats();
  updateNav();
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function vote(idx, val) {
  // Toggle off if already this value
  rows[idx][reviewCol] = rows[idx][reviewCol] === val ? null : val;
  // Update card classes
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  if (card) {
    card.className = 'card' + (rows[idx][reviewCol] === true ? ' voted-good' : rows[idx][reviewCol] === false ? ' voted-bad' : '');
    card.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('active'));
    if (rows[idx][reviewCol]) {
      const target = rows[idx][reviewCol] === true ? card.querySelector('.vote-tick') : card.querySelector('.vote-cross');
      if (target) target.classList.add('active');
    }
  }
  updateStats();
}

function updateStats() {
  const tick = rows.filter(r => r[reviewCol] === true).length;
  const cross = rows.filter(r => r[reviewCol] === false).length;
  const pending = rows.length - tick - cross;
  document.getElementById('count-tick').textContent = tick;
  document.getElementById('count-cross').textContent = cross;
  document.getElementById('count-pending').textContent = pending;
  const reviewed = tick + cross;
  document.getElementById('progress-text').textContent = `${reviewed} / ${rows.length} reviewed`;
  document.getElementById('progress-fill').style.width = (rows.length ? (reviewed/rows.length*100) : 0) + '%';
}

function updateNav() {
  const totalPages = Math.ceil(rows.length / PAGE_SIZE);
  document.getElementById('page-info').textContent = `Page ${currentPage + 1} of ${totalPages}`;
  document.getElementById('prev-btn').disabled = currentPage === 0;
  document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;
}

function navigate(dir) {
  const totalPages = Math.ceil(rows.length / PAGE_SIZE);
  const next = currentPage + dir;
  if (next < 0 || next >= totalPages) return;
  currentPage = next;
  renderPage();
  document.getElementById('cards-area').scrollTop = 0;
}

function exportCSV() {
  // Export as JSON if loaded from JSON, else CSV
  let blob, filename;
  if (sourceFormat === 'json') {
    blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
    filename = 'reviewed_data.json';
  } else {
    const csv = toCSV(headers, rows);
    blob = new Blob([csv], { type: 'text/csv' });
    filename = 'reviewed_data.csv';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// ---------- Keyboard shortcuts ----------
document.addEventListener('keydown', e => {
  if (!document.getElementById('review-layout').classList.contains('active')) return;
  const start = currentPage * PAGE_SIZE;
  const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4,
                   'q': 0, 'w': 1, 'e': 2, 'r': 3, 't': 4 };
  const key = e.key.toLowerCase();

  if (key in keyMap) {
    const slot = keyMap[key];
    const idx = start + slot;
    if (idx < rows.length) {
      const type = ['1','2','3','4','5'].includes(e.key) ? 'tick' : 'cross';
      vote(idx, type);
    }
  } else if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === 'ArrowLeft') navigate(-1);
});
</script>
</body>
</html>
